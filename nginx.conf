server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundle is built with VITE_API_URL=/api, so the API and the uploaded
    # images are reached through this container rather than cross-origin.
    location /api/ {
        proxy_pass http://server:4001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://server:4001/uploads/;
        proxy_set_header Host $host;
    }

    # Vite fingerprints these filenames, so a year is safe — a new build is a
    # new URL. index.html deliberately isn't matched here: it must revalidate,
    # otherwise a deploy keeps serving the old asset URLs.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/javascript matters: nginx 1.21.1+ maps .js to it rather than to
    # application/javascript, so listing only the latter silently shipped every
    # bundle uncompressed — ~384kB of JS instead of ~125kB.
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;
}
