server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. `always` so they are sent on error responses too.
    #
    # NOTE: nginx does not merge add_header across levels — a location with its
    # own add_header drops every one inherited from here. Any location below
    # that sets a header must therefore repeat the ones it still needs.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Enable once TLS terminates in front of this container, and not before:
    # HSTS on a host still reachable over http will lock clients out of it.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundle is built with VITE_API_URL=/api, so the API and the uploaded
    # images are reached through this container rather than cross-origin.
    #
    # `^~` is load-bearing, not decoration. A plain prefix location loses to a
    # regex location, so /uploads/photo.png would match the static-asset regex
    # below and be looked up on this container's filesystem — a 404 for every
    # admin-uploaded image. `^~` stops matching here before the regex is tried.
    location ^~ /api/ {
        proxy_pass http://server:4001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://server:4001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints these filenames, so a year is safe — a new build is a
    # new URL. index.html deliberately isn't matched here: it must revalidate,
    # otherwise a deploy keeps serving the old asset URLs.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        # One header, not `expires 1y` plus an add_header — that emitted
        # Cache-Control twice. Clients merge duplicates per RFC 9111 so the
        # behaviour was right, but one explicit value leaves nothing to merge.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Repeated because the add_header above discards the inherited set.
        # Only nosniff matters for a subresource; the framing and referrer
        # policies apply to documents, which this location never serves.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # `expires` rather than add_header: it emits Cache-Control: no-cache on its
    # own, so this location keeps inheriting the security headers above.
    location = /index.html {
        expires -1;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/javascript matters: nginx 1.21.1+ maps .js to it rather than to
    # application/javascript, so listing only the latter silently shipped every
    # bundle uncompressed — ~384kB of JS instead of ~125kB.
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;
}
