<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Analytics loads as high in the head as it can without displacing
         charset, which the parser has to see inside the first 1024 bytes.
         This file is the single shell for every route — the SPA swaps views
         under #root without a document reload — so the tags belong here and
         must not be repeated anywhere else. See the SPA note in README/below:
         the initial PageView fires on load only; in-app navigation does not
         re-fire it without a history-change trigger. -->

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '4558617367730091');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-THHX4RSC');</script>
    <!-- End Google Tag Manager -->

    <meta
      name="description"
      content="RadiantWay Travel — Effortless Journeys. Lasting Memories. UAE-based travel experts crafting tailored tour packages, visa assistance, and unforgettable holidays worldwide."
    />
    <meta name="theme-color" content="#0b1a2f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Images are the heaviest thing on the page and come from a third origin;
         opening the connection during head parse saves a DNS+TLS round trip. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!-- Only 400/500/600/700 are ever used (font-medium/semibold/bold + the
         default), so the other five weights were pure download. Loaded via
         media="print" so the stylesheet never blocks first paint; display=swap
         renders text in the fallback face until the webfont lands. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- LCP preload: the hero's first slide. Kept in sync with slides[0] in
         src/components/sections/Hero.jsx — it has to live here to start
         downloading during head parse rather than after React mounts.
         imagesrcset means a phone still only pulls the 480w file. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      imagesizes="100vw"
      href="https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=1920&q=80"
      imagesrcset="
        https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=480&q=80 480w,
        https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=768&q=80 768w,
        https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=1200&q=80 1200w,
        https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=1920&q=80 1920w"
    />
    <title>RadiantWay Travel — Effortless Journeys. Lasting Memories.</title>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-THHX4RSC"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Meta Pixel Code (noscript) -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=4558617367730091&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code (noscript) -->

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
