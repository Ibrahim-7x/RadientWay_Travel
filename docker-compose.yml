# RadiantWay Travel — local dev stack.
#
# Host ports are deliberately offset from the Farland-Travel stack (which holds
# 5173, 80, 3001 and 3306) so both projects can run side by side:
#
#   frontend (Vite dev) → http://localhost:5273
#   API                 → http://localhost:4101/api
#   frontend (prod)     → http://localhost:8081   (profile: prod)
#
# Container-internal ports stay at the project's defaults (5173 / 4001).
name: radiantway

services:

  # ── Express API. Applies migrations + idempotent seed on start. ──
  server:
    build:
      # Repo root, so the image can include src/data — prisma/seed.js imports it
      # as ../../src/data/*.js. See server/Dockerfile.
      context: .
      dockerfile: server/Dockerfile
      target: development
    ports:
      - "4101:4001"
    volumes:
      - ./server:/app
      # Anonymous volume: keeps the image's Linux node_modules (and the musl
      # Prisma engine) instead of the host's Windows-built ones.
      - /app/node_modules
      # Where seed.js's ../../src/data resolves to once WORKDIR is /app.
      - ./src/data:/src/data:ro
    environment:
      # These override server/.env — dotenv does not overwrite already-set vars.
      NODE_ENV: development
      PORT: "4001"
      DATABASE_URL: "file:./dev.db"
      # Origins the browser actually uses against the published host port. The
      # Vite container proxies /api, so those requests arrive without an Origin.
      CLIENT_ORIGIN: "http://localhost:5273,http://127.0.0.1:5273,http://localhost:8081,http://127.0.0.1:8081"
      PUBLIC_URL: "http://localhost:4101"
      # Live Google rating — set these in a root .env (or your shell) to hit the
      # Places API; unset, the badge falls back to Admin → Settings.
      GOOGLE_PLACES_API_KEY: "${GOOGLE_PLACES_API_KEY:-}"
      GOOGLE_PLACE_ID: "${GOOGLE_PLACE_ID:-}"
    command: sh -c "npx prisma migrate deploy && npm run seed && npm run dev"

  # ── Vite dev server (React frontend) ──
  dev:
    build:
      context: .
      target: development
    ports:
      - "5273:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      # Relative base + proxy below means no cross-origin request, so no CORS.
      VITE_API_URL: /api
      # "localhost" inside this container is the container itself — reach the
      # API by its compose service name.
      API_PROXY_TARGET: http://server:4001
      # Suppress vite's `open: true`; there is no browser in here.
      VITE_OPEN: "false"
      # Windows bind mounts deliver no inotify events to the container, so
      # without polling Vite never picks up edits. See vite.config.js.
      VITE_USE_POLLING: "true"
    depends_on:
      - server
    command: npm run dev -- --host 0.0.0.0

  # ── Static production build behind nginx. Opt in with --profile prod. ──
  prod:
    build:
      context: .
      target: production
      args:
        VITE_API_URL: /api
    ports:
      - "8081:80"
    environment:
      NODE_ENV: production
    depends_on:
      - server
    profiles:
      - prod
